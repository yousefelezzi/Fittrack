server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. Because this runs
    # server-side (inside the same docker network), it works no matter
    # what host/IP the browser used to load the page — desktop, phone,
    # tablet, whatever. This is what makes VITE_API_URL unnecessary.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
    }

    # React Router client-side routing: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
